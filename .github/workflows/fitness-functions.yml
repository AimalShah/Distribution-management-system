name: fitness-functions
on: [pull_request]
jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@dms/web
      # `size-limit` is defined in apps/web/package.json and configured by
      # apps/web/.size-limit.json. It measures dist/assets, so the build above
      # has to run first.
      - run: pnpm --filter @dms/web run size-limit

  table-pagination-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rn "<table" apps/web/src --include="*.tsx" | grep -v "packages/ui/src/components/data-table.tsx"; then
            echo "Raw <table> found outside the shared DataTable wrapper"; exit 1
          fi

  checkpoint-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Runs the suites listed in checkpoints/parity-gate.ts, plus the gate's own
      # consistency test. `pnpm exec vitest` was here before and resolved
      # nothing: the root had no vitest dependency, so the step failed before any
      # test executed while the workflow still read as if it were checking
      # parity. Playwright was installed here for the same reason of
      # appearances -- no parity suite imports it.
      - run: pnpm run test:parity
      # The server suite is the other half of this job: it mocks the database and
      # covers every checkpoint's behaviour, and no other workflow runs it.
      - run: pnpm --filter @dms/server test
